name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CarrierID.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarrierID-apk
          path: CarrierID.apk

      # Latest APK always available at: Releases -> "latest-build"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build CarrierID.apk \
            --title "Carrier ID – latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download CarrierID.apk on your phone and install it (allow 'Install unknown apps')." \
            --target "$GITHUB_SHA"

      # Also keep the APK on an 'apk' branch
      - name: Push APK to apk branch
        run: |
          mkdir out && cp CarrierID.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add CarrierID.apk && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
