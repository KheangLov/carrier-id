name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Stable signing key from repository secrets (Settings → Secrets → Actions).
      # Either Carrier ID's own secrets, or the same key as Pratitin
      # (PRATITIN_KEYSTORE_BASE64 + PRATITIN_KEYSTORE_PASSWORD, key alias "pratitin").
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARRIERID_KEYSTORE_B64 }}
          PRATITIN_B64: ${{ secrets.PRATITIN_KEYSTORE_BASE64 }}
          PRATITIN_PASSWORD: ${{ secrets.PRATITIN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] && [ -n "$PRATITIN_B64" ]; then
            KEYSTORE_B64="$PRATITIN_B64"
            echo "CARRIERID_KEY_ALIAS=pratitin" >> "$GITHUB_ENV"
            echo "::add-mask::$PRATITIN_PASSWORD"
            echo "CARRIERID_PRATITIN_PASSWORD=$PRATITIN_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the Pratitin signing key"
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/carrierid.jks"
            echo "CARRIERID_KEYSTORE=$RUNNER_TEMP/carrierid.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable release key"
          else
            echo "::warning::No CARRIERID_KEYSTORE_B64 secret: signing with a temporary debug key"
          fi

      - name: Test and build release APK
        env:
          CARRIERID_KEYSTORE_PASSWORD: ${{ secrets.CARRIERID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$CARRIERID_KEYSTORE_PASSWORD" ]; then export CARRIERID_KEYSTORE_PASSWORD="$CARRIERID_PRATITIN_PASSWORD"; fi
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CarrierID.apk
          ls -la CarrierID.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarrierID-apk
          path: CarrierID.apk

      # Latest APK always available at: Releases -> "latest-build"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build CarrierID.apk \
            --title "Carrier ID – latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download CarrierID.apk on your phone and install it (allow 'Install unknown apps')." \
            --target "$GITHUB_SHA"

      # Also keep the APK on an 'apk' branch
      - name: Push APK to apk branch
        run: |
          mkdir out && cp CarrierID.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add CarrierID.apk && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
